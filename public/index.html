<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狗蛋</title>
<style>
/* 配色只改 --a / --a2 两个色标，--accent / --accent-soft / --user 由它们混出来，
   深色下同一套色板会自动提亮、加深底色，不用为每套配色各写一遍 */
:root{
  --a:#4d6dfe; --a2:#8a5cff;
  --bg:#ffffff; --panel:#f7f8fa; --panel-2:#eef0f4; --border:#e6e8ec; --line:#eef0f3;
  --text:#17181a; --muted:#8b909a; --danger:#e5484d;
  --accent:var(--a); --accent-soft:color-mix(in srgb,var(--a) 10%,#fff); --user:color-mix(in srgb,var(--a) 12%,#fff);
  --radius:16px; --sidebar:272px; --shadow:0 1px 2px rgba(16,24,40,.05);
}
/* 深色底色要跟着色板走，所以每套色板都配一组深色底；只有底色列在这里，其余靠 color-mix */
html[data-c=violet]{--a:#7b5cff; --a2:#c061f2}
html[data-c=teal]{--a:#0f9b8e; --a2:#39c6cd}
html[data-c=green]{--a:#1f9d55; --a2:#6cc24a}
html[data-c=amber]{--a:#e2703a; --a2:#f0a63a}
html[data-c=rose]{--a:#e0457b; --a2:#f2789f}

@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){ --bg:#17181c; --panel:#1d1f25; --panel-2:#25282f; --border:#2b2f37; --line:#252830;
         --text:#e8eaee; --muted:#98a0ac; --shadow:none;
         --accent:color-mix(in srgb,var(--a) 76%,#fff); --accent-soft:color-mix(in srgb,var(--a) 26%,#17181c);
         --user:color-mix(in srgb,var(--a) 28%,#17181c); }
}
html[data-theme=light]{ --bg:#fff; --panel:#f7f8fa; --panel-2:#eef0f4; --border:#e6e8ec; --line:#eef0f3;
  --text:#17181a; --muted:#8b909a;
  --accent:var(--a); --accent-soft:color-mix(in srgb,var(--a) 10%,#fff); --user:color-mix(in srgb,var(--a) 12%,#fff);
  --shadow:0 1px 2px rgba(16,24,40,.05); }
html[data-theme=dark]{ --bg:#17181c; --panel:#1d1f25; --panel-2:#25282f; --border:#2b2f37; --line:#252830;
  --text:#e8eaee; --muted:#98a0ac; --shadow:none;
  --accent:color-mix(in srgb,var(--a) 76%,#fff); --accent-soft:color-mix(in srgb,var(--a) 26%,#17181c);
  --user:color-mix(in srgb,var(--a) 28%,#17181c); }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;overflow:hidden;background:var(--bg);color:var(--text);
     font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ——— 侧栏 ——— */
#sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);
         border-right:1px solid var(--border);display:flex;flex-direction:column}
.sbar-hd{height:56px;display:flex;align-items:center;padding:0 12px 0 16px;gap:8px}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:7px}
.brand i{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--a2));
  display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;font-style:normal;line-height:1}
.btn-new{margin:2px 12px 10px;padding:10px 12px;border-radius:12px;background:var(--accent);color:#fff;
         font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px}
.btn-new:hover{filter:brightness(1.05)}
#convList{flex:1;overflow-y:auto;padding:0 8px 8px}
.search{margin:10px 8px 4px;padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:13px}
.search:focus{outline:none;border-color:var(--accent)}
.hit{padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:12px;line-height:1.5}
.hit:hover{background:var(--panel-2)}
.hit b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.hit mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
#moreBar{margin:2px 8px 6px;text-align:center}
#moreBar button{font-size:12px;padding:5px 12px;border-radius:9px;color:var(--muted);background:var(--panel-2)}
.sect+.hint{text-align:left;line-height:1.6;margin:-2px 0 9px}
@keyframes flash{0%,60%{background:var(--accent-soft)}100%{background:transparent}}
.msg.flash{animation:flash 1.8s ease-out;border-radius:14px}
.conv{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;margin-bottom:2px;cursor:pointer;color:var(--text)}
.conv:hover{background:var(--panel-2)}
.conv.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.conv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.conv .x{opacity:.5;padding:0 5px;font-size:15px;line-height:1;color:var(--muted)}
.conv:hover .x{opacity:1}
.conv .x:hover{color:var(--danger)}
.sbar-ft{border-top:1px solid var(--border);padding:8px;display:flex;gap:6px;flex-wrap:wrap}
.sbar-ft button{flex:1;min-width:74px;padding:8px 6px;border-radius:9px;font-size:13px;color:var(--muted)}
.sbar-ft button:hover{background:var(--panel-2);color:var(--text)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:var(--muted)}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}

/* ——— 主区 ——— */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 12px;
     border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent)}
#convTitle{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modelchip{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:3px 10px;
           max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-wrap{position:relative}
.pop{position:absolute;right:0;top:38px;background:var(--bg);border:1px solid var(--border);border-radius:10px;
     box-shadow:0 8px 24px rgba(16,24,40,.12);padding:4px;min-width:150px;display:none;z-index:30}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.pop button:hover{background:var(--panel)}

#chat{flex:1;overflow-y:auto;overscroll-behavior:contain}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
#msgs{padding:22px 0 8px}

/* 消息 */
.msg{display:flex;gap:12px;margin-bottom:26px}
.msg .col{min-width:0;flex:1}
.msg.user{justify-content:flex-end}
.msg.user .col{flex:0 1 auto;max-width:min(560px,86%);display:flex;flex-direction:column;align-items:flex-end}
.avatar{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--a2));
        color:#fff;font-size:12px;display:grid;place-items:center;margin-top:2px;font-weight:700}
.bubble{background:var(--user);border-radius:var(--radius);padding:10px 15px;white-space:pre-wrap;word-break:break-word}
.msg.ai .body{min-width:0}
.msg.ai .body>*:first-child{margin-top:0}
.msg.ai .body>*:last-child{margin-bottom:0}
.imgs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:8px}
.imgs img{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--border);cursor:zoom-in;background:var(--panel)}
.acts{display:flex;gap:4px;margin-top:7px;opacity:0;transition:.15s;font-size:12px;color:var(--muted)}
.msg:hover .acts,.acts.stay{opacity:1}
/* 触屏没有 hover，操作行一直显出来，否则手机上根本找不到朗读和收藏 */
@media (hover:none){.acts{opacity:1}}
.acts button{padding:4px 9px;border-radius:8px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.acts button:hover{background:var(--panel-2);color:var(--text)}
.acts button.on{color:var(--accent);background:var(--accent-soft)}
/* 图标用同一份路径，靠 fill 在空心/实心之间切换，状态一变就是「已生效」 */
.acts .ic{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:currentColor;stroke-width:1.7;
          stroke-linecap:round;stroke-linejoin:round;transition:.18s;pointer-events:none}
.acts .ic .n{fill:none}
.acts button.on .ic,.acts button.saved .ic{fill:currentColor}
.acts button .i-stop{display:none}
.acts button.on .i-play{display:none}
.acts button.on .i-stop{display:block}
/* 朗读进行中：图标一下一下地跳，竖屏只看图标也知道是在播还是停了 */
.acts button.speak.on .ic{animation:beat .95s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.16)}}
.acts .tag{color:var(--muted);padding:4px 6px;background:none;font-size:12px}
.acts button.note{position:relative}
.acts button.note .bdg{position:absolute;top:-1px;right:0;min-width:14px;height:14px;padding:0 3px;
  border-radius:8px;background:var(--accent);color:#fff;font-size:9px;line-height:14px;text-align:center;display:none}
.acts button.note.saved .bdg{display:block}
.acts button.note.saved{color:var(--accent)}
/* 收藏是高频动作：常态就染成主题色实心，不再和复制/导出一样是灰描边 */
.acts button.note{color:var(--accent);padding-left:7px;padding-right:7px}
.acts button.note .ic{width:16px;height:16px;flex-basis:16px;fill:currentColor;stroke-width:1.1}
.acts button.note:hover{background:var(--accent-soft);color:var(--accent)}
/* 已收藏改用底色圈住，和"未收藏"的实心图标还是能一眼分开 */
.acts button.note.saved{background:var(--accent-soft)}
.acts .docMenu{display:flex;gap:3px;padding:2px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border)}
.acts .docMenu button{padding:3px 8px;border-radius:7px}
.editbox{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--accent);background:var(--bg);resize:vertical}

/* 导出成品：像是 AI 发回来的一份文件，名字 + 类型 + 大小，下载按钮在右边 */
.msg.file .col{max-width:min(520px,100%)}
.fileCard{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;text-align:left;
  border:1px solid var(--border);border-radius:14px;background:var(--panel)}
.fileCard .ftag{flex:0 0 auto;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  color:#fff;font-size:10px;font-weight:700;letter-spacing:.4px}
.fileCard .ftag.docx{background:#2b6cdf}
.fileCard .ftag.pdf{background:#d0342c}
.fileCard .fmeta{flex:1;min-width:0;overflow:hidden}
/* span 默认是 inline，名字和副行会挤成一行、省略号也永不触发，必须块级 */
.fileCard .fname{display:block;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileCard .fsub{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileCard .fdl{flex:0 0 auto;padding:7px 15px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px}
/* 还在转换：虚线边 + 灰按钮，点也没用 */
.fileCard.ping{border-style:dashed}
.fileCard.ping .ftag{opacity:.55}
.fileCard.ping .fdl{background:var(--panel-2);color:var(--muted);cursor:progress}
@media (max-width:767px) and (orientation:portrait){
  .fileCard .ftag{width:34px;height:34px}
  .fileCard .fdl{padding:7px 12px}
}

/* markdown */
.msg.ai .body h1,.msg.ai .body h2,.msg.ai .body h3{line-height:1.4;margin:18px 0 8px}
.msg.ai .body h1{font-size:20px}.msg.ai .body h2{font-size:18px}.msg.ai .body h3{font-size:16px}
.msg.ai .body p{margin:9px 0}
.msg.ai .body ul,.msg.ai .body ol{padding-left:22px;margin:9px 0}
.msg.ai .body li{margin:4px 0}
.msg.ai .body blockquote{margin:10px 0;padding:2px 0 2px 12px;border-left:3px solid var(--border);color:var(--muted)}
.msg.ai .body table{border-collapse:collapse;margin:12px 0;display:block;overflow-x:auto;max-width:100%}
.msg.ai .body th,.msg.ai .body td{border:1px solid var(--border);padding:6px 10px;font-size:14px}
.msg.ai .body th{background:var(--panel)}
.msg.ai .body a{color:var(--accent)}
.msg.ai .body pre{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:12px;
                  padding:34px 14px 12px;overflow-x:auto;margin:12px 0}
.msg.ai .body pre code{font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6}
.msg.ai .body code:not(pre code){background:var(--panel-2);padding:1.5px 6px;border-radius:6px;font-size:13px;
                                 font-family:ui-monospace,Consolas,monospace}
.copy{position:absolute;top:7px;right:8px;font-size:11px;padding:3px 9px;border-radius:7px;background:var(--panel-2);color:var(--muted)}
.copy:hover{color:var(--text)}

/* 思考 / 工具 / 通知 */
details.think{margin:0 0 10px;border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
details.think summary{cursor:pointer;user-select:none;padding:7px 12px;font-size:13px;color:var(--muted);list-style:none}
details.think summary::-webkit-details-marker{display:none}
details.think summary::before{content:"◈ ";color:var(--accent)}
details.think[open] summary{border-bottom:1px solid var(--line)}
details.think pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13px;
                  line-height:1.65;margin:0;padding:10px 12px;color:var(--muted);max-height:320px;overflow:auto}
.tool{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:8px 12px;margin-bottom:8px;font-size:13px}
.tool .hd{display:flex;align-items:baseline;gap:8px}
.tool.fold .hd{cursor:pointer;user-select:none}
.tool .hd b{font-weight:600;font-size:13px}
/* 摘要只说「搜了几个关键词、参考了几条网址」，参数和链接收进折叠区，点开才看 */
.tool .sum{flex:1;min-width:0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .st{font-size:12px;color:var(--muted);white-space:nowrap}
.tool .chev{font-size:10px;color:var(--muted);transition:transform .18s}
.tool:not(.fold) .chev{display:none}
.tool.fold.open .chev{transform:rotate(90deg)}
.tool.ok{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.tool.ok .st{color:var(--accent)}
.tool.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
.tool.bad .st{color:var(--danger)}
.tool .det{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted);line-height:1.6}
.tool .args{word-break:break-all;white-space:pre-wrap}
.tool .src{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.tool .src a{color:var(--accent);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.tool .src a:hover{text-decoration:underline}
.tool details{margin-top:6px}
.tool summary{cursor:pointer}
.tool pre{margin:6px 0 0;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;color:var(--muted)}
.notice{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:6px 11px;margin-bottom:8px}
.err{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,var(--border));
     background:color-mix(in srgb,var(--danger) 8%,transparent);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
.warn{font-size:12px;color:var(--danger);margin-top:6px;word-break:break-word}
.cursor::after{content:"▋";margin-left:1px;animation:blink 1s step-end infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.pend{color:var(--muted);font-size:13px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

#toBottom{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;
          background:var(--bg);border:1px solid var(--border);box-shadow:0 4px 12px rgba(16,24,40,.12);
          display:none;place-items:center;font-size:15px;color:var(--muted);z-index:20}
#toBottom.on{display:grid}

/* ——— 输入区 ——— */
#composer{padding:8px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
#attStrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.att{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--panel)}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.62);
         color:#fff;font-size:12px;line-height:18px;text-align:center}
.att.busy{opacity:.5}
.box{background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:8px 10px 8px 12px;
     box-shadow:var(--shadow);transition:border-color .15s}
.box:focus-within{border-color:var(--accent)}
#input{width:100%;resize:none;border:none;outline:none;background:none;max-height:190px;min-height:30px;
       line-height:1.6;padding:4px 2px;font-size:15px}
.row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);color:var(--muted);
      display:flex;align-items:center;gap:5px;background:var(--bg)}
.pill:hover{color:var(--text)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.grow{flex:1}
#counter{font-size:12px;color:var(--muted)}
#send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
#send[disabled]{opacity:.4}
#send.stop{background:var(--danger)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px}

/* 空状态 */
.empty{padding:56px 8px 20px;text-align:center}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:700}
.empty p{margin:0 0 22px;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;max-width:640px;margin:0 auto;text-align:left}
.cards button{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--bg);transition:.15s}
.cards button:hover{border-color:var(--accent);color:var(--accent)}
.cards b{display:block;font-size:14px;margin-bottom:3px}
.cards span{font-size:12.5px;color:var(--muted)}
.cards button:hover span{color:var(--accent)}

/* ——— 抽屉 ——— */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);
        border-left:1px solid var(--border);transform:translateX(100%);transition:.22s;z-index:50;
        display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer header{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border)}
#drawer header b{flex:1;font-size:16px}
#drawer .pad{flex:1;overflow-y:auto;padding:16px}
.sect{margin:6px 0 10px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.pv{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.pv.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pv h4{margin:0 0 3px;font-size:14px;display:flex;align-items:center;gap:8px}
.pv h4 em{flex:1;font-style:normal}
.pv .meta{font-size:12px;color:var(--muted);word-break:break-all;line-height:1.7}
.pv .acts2{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.pv .acts2 button{font-size:12px;padding:5px 11px;border-radius:8px;background:var(--panel);border:1px solid var(--border)}
.tag{font-size:11px;padding:1px 8px;border-radius:20px;background:var(--accent);color:#fff}
label.f{display:block;font-size:12px;color:var(--muted);margin:11px 0 4px}
label.f input,label.f select,label.f textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
label.f textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;resize:vertical;min-height:64px}
label.f code{font-family:inherit;color:var(--text)}
.primary{padding:10px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;width:100%;margin-top:12px}
.ghost{padding:10px;border-radius:10px;background:var(--panel);color:var(--text);width:100%;margin-top:8px;border:1px solid var(--border)}
.switch{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.switch span{flex:1;font-size:14px}
.switch small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.tgl{width:42px;height:24px;border-radius:20px;background:var(--panel-2);position:relative;transition:.18s;flex:0 0 42px}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on{background:var(--accent)}
.tgl.on::after{left:21px}

/* 登录 / 灯箱 / toast */
#gate{position:fixed;inset:0;background:var(--bg);z-index:90;display:grid;place-items:center;padding:20px}
#gate form{width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
#gate h1{font-size:22px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
#gate h1 i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--a2));
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;font-style:normal;line-height:1}
#gate p{color:var(--muted);font-size:13px;margin:0}
#gate input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--border);background:var(--bg)}
/* .primary 自带 12px 上边距，flex 的 gap 已经留过位置了，登录页里收掉 */
#gate .primary{margin-top:2px}
#gate .mid{display:flex;gap:6px;align-items:center;justify-content:center}
#gate .link{color:var(--accent);font-size:13px;padding:0}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:80;display:none;place-items:center;padding:24px}
#lightbox.on{display:grid}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);
       padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:80vw}
#toast.on{opacity:.94;transform:translateX(-50%)}
.hide{display:none!important}

/* 色板选择 */
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 12px}
.sw{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--s1),var(--s2));
    border:2px solid transparent;box-shadow:0 0 0 1px var(--border) inset}
.sw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--bg) inset}

/* ——— 响应式 ——— */
@media (max-width:860px){ .modelchip{display:none} }
@media (max-width:767px) and (orientation:portrait){
  /* 竖屏窄，操作行只留图标；状态全靠实心/空心区分，标签文字收起来 */
  .acts .lb{display:none}
  .acts button{padding:6px 8px}
  .acts .ic{width:17px;height:17px;flex-basis:17px}
  .acts button.note .ic{width:19px;height:19px;flex-basis:19px}
}
@media (max-width:767px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:.22s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  #sidebar.on{transform:none}
  #menuBtn{display:grid}
  .wrap{padding:0 12px}
  .msg .col{max-width:none}
  .avatar{flex-basis:26px;width:26px;height:26px;font-size:11px}
  #toBottom{bottom:108px}
}
@media (min-width:768px){ #menuBtn{display:none} }

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" crossorigin></script>
<script>
const $ = (s) => document.querySelector(s);
const S = {
  token: localStorage.getItem('db.tok') || '',
  // 只记手机号方便下次登录，密码一律由浏览器自己记住
  phone: localStorage.getItem('db.phone') || '',
  providers: [], mcps: [], convs: [], convId: null, convTitle: '新对话',
  streaming: false, abort: null, editing: null, editingMcp: null,
  // 下面这一整组在 D1 里有一份，这里只是登录前/断网时的本机缓存，登录后被服务端覆盖
  net: localStorage.getItem('db.net') !== '0',
  tts: localStorage.getItem('db.tts') === '1',
  voice: localStorage.getItem('db.voice') || 'zh-CN-XiaoxiaoNeural',
  hint: localStorage.getItem('db.hint') === '1',
  regenOn: localStorage.getItem('db.regen') === '1',
  accent: localStorage.getItem('db.accent') || 'blue',
  theme: localStorage.getItem('db.theme') || 'auto',
  name: localStorage.getItem('db.name') || '狗蛋',
  atts: [], msgs: [],
};
function appName() { return S.name || '狗蛋'; }
function applyName(n) {
  S.name = n || '狗蛋';
  localStorage.setItem('db.name', S.name);
  document.title = S.name;
  $('#brandName').textContent = S.name;
  $('#gateName').textContent = S.name;
  $('#input').placeholder = `发消息给 ${S.name}…（Enter 发送 / Shift+Enter 换行，可粘贴或拖入图片）`;
  // 品牌位不能是个空色块：和头像同一个路子，放名字首字，改名后登录页和侧栏一起换
  document.querySelectorAll('.brand i, #gate h1 i').forEach((el) => { el.textContent = nameChar(); });
  // 头像跟着名字走，改名后已经渲染出来的那些也要重画
  document.querySelectorAll('.avatar').forEach((a) => { a.textContent = nameChar(); });
}
function nameChar() { return Array.from(appName().trim())[0] || 'A'; }
applyName(S.name);

// ——— 配色 ——————————————————————————————
// 每套配色只定两个色标，强调色、底色、气泡色都由 CSS 用 color-mix 推出来，
// 深浅色因此共用同一份定义，加一套配色只是往数组里加一行
const PALETTES = [
  ['blue', '默认蓝', '#4d6dfe', '#8a5cff'],
  ['violet', '紫', '#7b5cff', '#c061f2'],
  ['teal', '青', '#0f9b8e', '#39c6cd'],
  ['green', '绿', '#1f9d55', '#6cc24a'],
  ['amber', '橙', '#e2703a', '#f0a63a'],
  ['rose', '玫红', '#e0457b', '#f2789f'],
];
function applyAccent(id) {
  S.accent = PALETTES.some(([x]) => x === id) ? id : 'blue';
  localStorage.setItem('db.accent', S.accent);
  document.documentElement.dataset.c = S.accent;
  document.querySelectorAll('#swatches .sw').forEach((b) => b.classList.toggle('on', b.dataset.c === S.accent));
}
$('#swatches').innerHTML = PALETTES.map(([id, name, a, a2]) =>
  `<button class="sw" data-c="${id}" title="${name}" style="--s1:${a};--s2:${a2}"></button>`).join('');
$('#swatches').onclick = (e) => { if (e.target.dataset.c) { applyAccent(e.target.dataset.c); pushSettings(); } };
applyAccent(S.accent);

// ——— 深浅色 ——————————————————————————————
// auto 是「不写 data-theme，交给系统偏好」，所以只能移掉属性，不能设成空串
function applyTheme(v) {
  S.theme = v === 'light' || v === 'dark' ? v : 'auto';
  localStorage.setItem('db.theme', S.theme);
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = S.theme;
}

// ——— 设置同步 ——————————————————————————————
// 服务端是唯一真源，localStorage 只是本机缓存：换设备、换浏览器登录进来要能还原。
// settingsLoaded 之前不推——那会儿手里只有本机默认值，推上去会把服务端的覆盖掉
let settingsLoaded = false;
let pushTimer = null;
function pushSettings() {
  if (!settingsLoaded) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    api('settings', {
      method: 'PUT',
      body: {
        appName: S.name, accent: S.accent, theme: S.theme, voice: S.voice,
        net: S.net, tts: S.tts, hint: S.hint, regen: S.regenOn,
      },
    }).catch(() => { /* 没存上就算了，下次改设置会再存一遍 */ });
  }, 600);
}
function applyServerSettings(s) {
  if (!s) return;
  applyName(s.appName);
  applyAccent(s.accent);
  applyTheme(s.theme);
  S.voice = s.voice;
  S.net = s.net; S.tts = s.tts; S.hint = s.hint; S.regenOn = s.regen;
  paintToggles();
  $('#voiceSel').value = S.voice;
  $('#setName').value = appName();
}

// ——— 基础设施 ——————————————————————————————
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (S.token) headers.authorization = 'Bearer ' + S.token;
  if (opts.body && !headers['content-type']) headers['content-type'] = 'application/json';
  const res = await fetch('/api/' + path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) { signOut(); throw new Error('会话已过期，请重新登录'); }
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('json')) throw new Error(`服务端返回了非 JSON 响应（${res.status}）`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `请求失败 ${res.status}`);
  return data;
}
function signOut() {
  stopSpeak();
  S.token = ''; S.convId = null; localStorage.removeItem('db.tok');
  // 退出后本机手里只剩默认值，此时再推设置会把服务端的真源盖掉
  settingsLoaded = false;
  $('#gatePhone').value = S.phone;
  $('#gate').classList.remove('hide');
}

// ——— 本地缓存（IndexedDB）—————————————————————————
// 服务端仍是数据的真源，这里只是首屏缓存：点开会话先画本地，再拉服务端校准。
// 缓存不可用（无痕、配额满、版本被占）时全部静默降级，绝不挡住正常聊天。
// 库名带上账号 sub：令牌格式是 `payload.sig`，解第一段并补齐 base64url 的填充符
function cacheDbName() {
  const raw = (S.token || '').split('.')[0];
  if (!raw) return 'doubao-cache-anon';
  const pad = raw.replace(/-/g, '+').replace(/_/g, '/');
  try {
    const sub = JSON.parse(atob(pad + '='.repeat((4 - (pad.length % 4)) % 4))).sub;
    return 'doubao-cache-' + (typeof sub === 'string' && sub ? sub : 'anon');
  } catch { return 'doubao-cache-anon'; }
}
function idbTx(stores, mode, fn, name = cacheDbName()) {
  return new Promise((resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };
    // v2 加了 files：导出的 Word/PDF 字节留在本地，刷新后气泡里还能下载
    const req = indexedDB.open(name, 2);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('convs')) d.createObjectStore('convs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('msgs')) {
        const s = d.createObjectStore('msgs', { keyPath: 'id' });
        s.createIndex('by_conv', 'conversation_id');
      }
      if (!d.objectStoreNames.contains('files')) {
        const s = d.createObjectStore('files', { keyPath: 'key' });
        s.createIndex('by_conv', 'conversation_id');
      }
    };
    req.onerror = () => done(null);
    req.onblocked = () => done(null);
    req.onsuccess = () => {
      const d = req.result;
      try {
        const t = d.transaction(stores, mode);
        // 多个 store 时按参数逐个传进来（不是数组），少一层下标少一个坑
        const args = stores.map((s) => t.objectStore(s));
        const out = fn(...args);
        t.oncomplete = () => { d.close(); done(out && out.result !== undefined ? out.result : out); };
        t.onerror = () => { d.close(); done(null); };
        t.onabort = () => { d.close(); done(null); };
      } catch { d.close(); done(null); }
    };
  });
}
// 会话表只 put 不 clear：服务端 10 天一清，本地还得留着名字，不然过期会话的命中只能显示「对话」
const cacheConvs = (rows) => idbTx(['convs'], 'readwrite', (s) => rows.forEach((r) => r?.id && s.put(r)));
const cacheMsgs = (convId, rows) => idbTx(['msgs'], 'readwrite', (s) => {
  rows.forEach((m) => m?.id && !String(m.id).startsWith('tmp_') && s.put({ ...m, conversation_id: convId }));
});
const cachedConvs = () => idbTx(['convs'], 'readonly', (s) => s.getAll()) ?? [];
// get() 没命中时 result 是 undefined，idbTx 会把请求对象本身返回出来，这里归一成 null
const cachedConv = (id) => idbTx(['convs'], 'readonly', (s) => s.get(id))
  .then((v) => (v && v.id === id ? v : null));
const cachedMsgs = (convId) => idbTx(['msgs'], 'readonly', (s) => s.index('by_conv').getAll(convId)) ?? [];
// 搜索要扫全库，图片 data URL 一条几百 KB，用游标只投影正文，别把整库搬进内存
const allCachedMsgs = () => idbTx(['msgs'], 'readonly', (s) => {
  const acc = [];
  s.openCursor().onsuccess = (e) => {
    const c = e.target.result;
    if (!c) return;
    const v = c.value;
    acc.push({ id: v.id, conversation_id: v.conversation_id, role: v.role, created_at: v.created_at, content: v.content });
    c.continue();
  };
  return { get result() { return acc; } };
});
const dropMsgCache = (convId) => cachedMsgs(convId).then((rows) =>
  idbTx(['msgs'], 'readwrite', (s) => rows.forEach((r) => s.delete(r.id))));
// 回退只抹掉这条及其之后的，更早的本地存档留着（服务端本来就是按 10 天清的）
const dropMsgCacheFrom = (convId, since) => cachedMsgs(convId).then((rows) =>
  idbTx(['msgs'], 'readwrite', (s) => rows.filter((r) => (r.created_at ?? 0) >= since).forEach((r) => s.delete(r.id))));
const dropConvCache = (convId) => idbTx(['convs'], 'readwrite', (s) => s.delete(convId));
const clearMsgCacheAll = () => idbTx(['convs', 'msgs', 'files'], 'readwrite', (cs, ms, fs) => { cs.clear(); ms.clear(); fs.clear(); });
// ——— 导出的文件：字节留在本地 files 库，气泡只是它的入口 ———
const cacheFile = (rec) => idbTx(['files'], 'readwrite', (s) => s.put(rec));
const listFiles = (convId) => idbTx(['files'], 'readonly', (s) => s.index('by_conv').getAll(convId)) ?? [];
const getFile = (key) => idbTx(['files'], 'readonly', (s) => s.get(key)).then((v) => (v && v.key === key ? v : null));
const dropFilesOf = (convId) => listFiles(convId).then((rows) =>
  idbTx(['files'], 'readwrite', (s) => rows.forEach((r) => s.delete(r.key))));
const dropFileKeys = (keys) => keys.length
  ? idbTx(['files'], 'readwrite', (s) => keys.forEach((k) => s.delete(k))) : Promise.resolve(null);
// 单用户版的缓存库名是 doubao-cache-owner，换手机号登录后库名跟着 sub 变了。
// 不搬这一次，超过 10 天、服务端早就清掉的那部分历史会在换号当天凭空消失
async function adoptLegacyCache() {
  const cur = cacheDbName();
  if (cur === 'doubao-cache-anon' || cur === 'doubao-cache-owner') return;
  const names = indexedDB.databases ? (await indexedDB.databases()).map((d) => d.name) : null;
  if (names && !names.includes('doubao-cache-owner')) return;
  const old = await idbTx(['convs'], 'readonly', (s) => s.getAll(), 'doubao-cache-owner');
  if (!old?.length) return;
  if ((await cachedConvs())?.length) return;   // 新库里已经有东西了，别拿旧的盖它
  const oldMsgs = await idbTx(['msgs'], 'readonly', (s) => s.getAll(), 'doubao-cache-owner');
  const oldFiles = await idbTx(['files'], 'readonly', (s) => s.getAll(), 'doubao-cache-owner');
  await idbTx(['convs'], 'readwrite', (s) => old.forEach((r) => r?.id && s.put(r)));
  await idbTx(['msgs'], 'readwrite', (s) => (oldMsgs ?? []).forEach((r) => r?.id && s.put(r)));
  await idbTx(['files'], 'readwrite', (s) => (oldFiles ?? []).forEach((r) => r?.key && s.put(r)));
}

const TOOL_ALIAS = {};
function toolLabel(name) { return TOOL_ALIAS[name] || name || '工具'; }
function parseAliasJson(s) {
  let v = {};
  try { v = typeof s === 'string' ? JSON.parse(s) : (s || {}); } catch { return {}; }
  if (!v || typeof v !== 'object' || Array.isArray(v)) return {};
  const out = {};
  for (const [k, val] of Object.entries(v)) if (typeof val === 'string' && val.trim()) out[k] = val.trim();
  return out;
}
function rebuildToolAliases() {
  for (const k of Object.keys(TOOL_ALIAS)) delete TOOL_ALIAS[k];
  for (const s of S.mcps) Object.assign(TOOL_ALIAS, parseAliasJson(s.tool_aliases));
  // 首屏先吃本地缓存，卡片可能已经用原名画出来了，这里补一次名字
  document.querySelectorAll('.tool[data-tname]').forEach((el) => { el.querySelector('b').textContent = toolLabel(el.dataset.tname); });
}
// 「原名=显示名」每行一条
function parseAliasText(text) {
  const out = {};
  for (const line of (text || '').split('\n')) {
    const i = line.indexOf('=');
    if (i < 0) continue;
    const k = line.slice(0, i).trim(), v = line.slice(i + 1).trim();
    if (k && v) out[k] = v;
  }
  return out;
}

// ——— 本地关键词搜索 ——————————————————————————
// 搜的是本机 IndexedDB 缓存，不查服务端：服务端 10 天就清，本地想搜多久都行
let searchTimer = null;
$('#searchBox').oninput = (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(() => (q ? runSearch(q) : loadConvs()), 220);
};
async function runSearch(q) {
  const [msgs, convs] = await Promise.all([allCachedMsgs(), cachedConvs()]);
  const titleOf = new Map(convs.map((c) => [c.id, c.title]));
  const key = q.toLowerCase();
  const hits = [];
  for (const m of msgs) {
    const text = m.content || '';
    const at = text.toLowerCase().indexOf(key);
    if (at < 0) continue;
    hits.push({
      conv: m.conversation_id, id: m.id, at: m.created_at, role: m.role,
      title: titleOf.get(m.conversation_id) || '对话',
      snippet: text.slice(Math.max(0, at - 40), at + 120),
    });
  }
  hits.sort((a, b) => b.at - a.at);
  paintHits(q, hits.slice(0, 40));
}
function paintHits(q, hits) {
  const box = $('#convList'); box.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'hit';
  head.innerHTML = `<b>${hits.length ? `${hits.length} 处命中` : '没有命中'}</b><span>只搜本机缓存过的消息</span>`;
  box.appendChild(head);
  const re = new RegExp(escapeRe(esc(q)), 'gi');
  for (const h of hits) {
    const d = document.createElement('div');
    d.className = 'hit';
    d.innerHTML = `<b>${esc(h.title)}</b>`
      + esc(h.snippet).replace(re, (m) => `<mark>${m}</mark>`)
      + `<span><br>${h.role === 'user' ? '我' : esc(appName())} · ${fmtTime(h.at)}</span>`;
    d.onclick = () => jumpToHit(h.conv, h.id);
    box.appendChild(d);
  }
}
async function jumpToHit(convId, msgId) {
  $('#searchBox').value = '';
  await openConv(convId);
  const find = () => [...$('#msgs').children].find((n) => n._data?.id === msgId);
  let node = find();
  // 命中的那条可能在服务端「最近 200 条」之外，往早翻页找，最多 5 页别翻到天亮
  for (let i = 0; !node && S.hasMore && i < 5; i++) { await loadOlder(); node = find(); }
  if (node) {
    node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    node.classList.add('flash');
    setTimeout(() => node.classList.remove('flash'), 1900);
  } else toast('这条只在本地缓存里，服务端已经取不到了');
  closeDrawers();
}
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// 导出的成品不再直接落地：先把文件当一条 AI 发回来的消息摆在会话里，下载按钮在它右边。

const FMT = {

// 转换要十几秒，这期间先按「提问里最长的那一段」猜个名字（服务端定名后会被覆盖，
// 那边还会让模型拟一个更短的）：整句提问当文件名又长又带「：？！」，存到 Windows 上就是灾难
function guessName(text) {
  const parts = String(text || '').split(/[^\p{Script=Han}\p{L}\p{N}]+/u).filter((x) => x.length >= 2);
  const best = parts.sort((a, b) => b.length - a.length)[0];

async function downloadFile(rec, btn) {
  if (rec.ping) return;
  let blob = rec.blob;
  if (!blob) {
    btn.disabled = true; btn.textContent = '读取中';
    blob = (await getFile(rec.key))?.blob ?? null;
    btn.disabled = false; btn.textContent = '下载';
    if (blob) rec.blob = blob;

  if (!blob) return toast('本地已经没有这份文件了，重新导出一次吧');
  const href = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = href; a.download = rec.name || `AI回答.${(FMT[rec.format] || FMT.DOCX).ext}`;
  document.body.appendChild(a); a.click(); a.remove();

  const rows = await listFiles(convId);

async function exportDoc(m, format, btn) {
  if (!m.id || !S.convId) return toast('这条还没存进会话，先等回答结束');
  const f = FMT[format] || FMT.DOCX;
  const lb = btn.querySelector('.lb');
  const label = lb.textContent;
  const key = `${m.id}|${format}`;
  const cid = S.convId;
  // 转换要十几秒，这期间先按服务端那套规则猜一个名字，响应回来再用 content-disposition 覆盖
  const i = S.msgs.findIndex((x) => x.id === m.id);
  const asked = i > 0 ? (S.msgs[i - 1].content || '') : '';
  const guess = guessName(asked || S.convTitle) + '.' + f.ext;
  const rec = { key, conversation_id: S.convId, message_id: m.id, format,
                name: guess, size: 0, at: Date.now(), ping: true };
  pendingFiles.add(key);
  document.querySelector(`#msgs [data-fkey="${CSS.escape(key)}"]`)?.remove();
  const host = btn.closest('.msg') || $('#msgs').lastElementChild;
  const el = fileNode(rec);
  host ? host.after(el) : $('#msgs').appendChild(el);
  scrollDown(true);
  btn.disabled = true; lb.textContent = '导出中…';
  try {
    const res = await fetch('/api/export', {
      method: 'POST',
      headers: { authorization: 'Bearer ' + S.token, 'content-type': 'application/json' },
      body: JSON.stringify({ conversationId: S.convId, messageId: m.id, format }),
    });
    if (res.status === 401) { signOut(); throw new Error('会话已过期，请重新登录'); }
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error || `导出失败（${res.status}）`);
    }
    const raw = (res.headers.get('content-disposition') || '').match(/filename\*=UTF-8''([^;]+)/);
    const blob = await res.blob();
    rec.ping = false; rec.size = blob.size; rec.blob = blob;
    if (raw) rec.name = decodeURIComponent(raw[1]).replace(/[\\/:*?"<>|]/g, '_') || guess;
    // 用发起时的 cid：中间切了会话再拿当前的 S.convId 存档，文件就挂错主人了
    await cacheFile({ key, conversation_id: cid, message_id: m.id, format,
                      name: rec.name, size: rec.size, at: rec.at, blob });
    el.replaceWith(fileNode(rec));
    toast('已生成，点气泡上的「下载」');
  } catch (err) {
    el.remove();

function toolSummary(d) {
  const kw = kwCount(d.args);

  const parts = [];
  if (kw) parts.push(`关键词 ${kw} 个`);
  if (urls) parts.push(`参考网址 ${urls} 个`);
  if (parts.length) return parts.join(' · ');
  // 参数本身就是一条网址的抓取/转换类工具，别把整条链接摊在摘要那一行上

    `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.url)}</a>`).join('') + '</div>';
  if (d.preview) h += `<details><summary>原始结果</summary><pre>${esc(d.preview)}</pre></details>`;

async function openConv(id) {

    const oldest = messages.length ? messages[0].created_at : 0;
    const keep = new Set(messages.map((m) => m.id));
    const archive = hasMore ? [] : cached.filter((m) => m.created_at < oldest && !keep.has(m.id));
    setMsgs([...archive, ...messages]);

  } catch (e) {

function compress(file) {

      const k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);   // 透明底转白底，jpeg 才不发黑
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      // 统一转 jpeg：v100 上的 qwen-vl 解码器收到 webp/gif 的 data URL 会回 400 "Failed to load image"
      let out = cv.toDataURL('image/jpeg', MAX_QUALITY);
      if (out.length > MAX_PER_IMG) out = cv.toDataURL('image/jpeg', 0.7);
      if (out.length > MAX_PER_IMG) out = cv.toDataURL('image/jpeg', 0.5);
      resolve(out);
    };
    img.src = URL.createObjectURL(file);
  });
}

// ——— 流式对话 ——————————————————————————————
// 必须同时解析 event: 和 data:（§5.7），只看 data 会把具名事件混成一锅
async function streamChat(body, onEvent) {
  const res = await fetch('/api/chat', {
    method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + S.token },
    body: JSON.stringify(body), signal: S.abort.signal,
  });
  if (res.status === 401) { signOut(); throw new Error('会话已过期，请重新登录'); }
  if (res.status === 413) throw new Error('请求体过大（图片太多或太大）');
  // Access 过期会 302 到登录页并返回 HTML，这里要认出来（§7.2）
  if (res.redirected || !(res.headers.get('content-type') || '').includes('event-stream')) {
    const t = await res.text().catch(() => '');
    let msg = '服务端没有返回事件流，可能被登录拦截了';
    try { msg = JSON.parse(t).error || msg; } catch {}
    throw new Error(msg);
  }
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      let ev = 'message', data = '';
      for (const line of raw.split('\n')) {
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      }
      if (!data) continue;
      try { onEvent(ev, JSON.parse(data)); } catch { /* 半截帧忽略 */ }
    }
  }
}

// 统一的发送入口：新消息 / 编辑重发 / 重新生成都走这里
async function send({ content, attachments = [], rollbackTo = null, regenerate = false } = {}) {
  if (S.streaming) return;
  const text = (content ?? $('#input').value).trim();
  const imgs = attachments.length ? attachments : (regenerate ? [] : S.atts);
  if (!text && !imgs.length && !regenerate) return;
  if (regenerate && !S.convId) return toast('还没有可重新生成的回答');

  const enabled = S.providers.find((p) => p.is_enabled);
  if (!enabled) { openDrawer(); return; }

  if (!regenerate) { $('#input').value = ''; autoGrow(); S.atts = []; paintAtts(); }
  else stopSpeak();

  // 编辑/重生成：先把被替换的那条及其之后的消息从界面上摘掉
  if (rollbackTo) dropFrom(rollbackTo);
  else if ($('#msgs').querySelector('.empty')) $('#msgs').innerHTML = '';

  S.streaming = true; S.abort = new AbortController(); setSend(true);

  const um = { id: 'tmp_u' + Date.now(), role: 'user', content: text, images: imgs, created_at: Date.now() };
  // live 只在这条推流期间存在：status 为 streaming 是「正在写」，不是「没写完就断了」
  const am = { id: 'tmp_a' + Date.now(), role: 'assistant', content: '', images: [], meta: null, status: 'streaming', live: true, created_at: Date.now() };
  if (!regenerate) { S.msgs.push(um); $('#msgs').appendChild(nodeFor(um)); }
  S.msgs.push(am);
  const el = nodeFor(am); $('#msgs').appendChild(el);
  scrollDown(true);

  const { col } = el._refs;
  const think = col.querySelector('.think'), toolBox = col.querySelector('.tools');
  const bodyEl = col.querySelector('.body'), actsEl = col.querySelector('.acts');
  bodyEl.classList.add('cursor');
  bodyEl.innerHTML = '<span class="pend">正在思考…</span>';   // 首字要等供应商往返，先给个等待态，别让人以为发不出去
  let reasonText = '', answer = '', notices = [];
  const cards = new Map();
  const paint = () => { bodyEl.innerHTML = renderMd(answer); decorate(bodyEl); scrollDown(); };

  try {
    await streamChat({ content: text, attachments: imgs, conversationId: S.convId,
                        useSearch: S.net, regenerate, rollbackTo }, (ev, d) => {
      if (ev === 'meta') {
        S.convId = d.conversationId;
        if (um.id.startsWith('tmp_')) um.id = d.userMessageId || um.id;
        if (am.id.startsWith('tmp_')) am.id = d.assistantMessageId || am.id;
      } else if (ev === 'reasoning') {
        reasonText += d.delta; think.hidden = false;
        think.innerHTML = `<summary>思考过程（${reasonText.length} 字）</summary><pre>${esc(reasonText)}</pre>`;
        scrollDown();
      } else if (ev === 'text') { answer += d.delta; am.content = answer; paint(); }
      else if (ev === 'notice') { notices.push(d.message); toolBox.insertAdjacentHTML('beforeend', `<div class="notice">${esc(d.message)}</div>`); scrollDown(); }
      else if (ev === 'tool_start') { const c = liveTool(d); cards.set(d.callId, c); toolBox.appendChild(c); scrollDown(); }
      else if (ev === 'tool_retry') { const c = cards.get(d.callId); if (c) c.querySelector('.st').textContent = d.message; }
      else if (ev === 'tool_done') { doneTool(cards.get(d.callId), d); scrollDown(); }
      else if (ev === 'tool_error') { badTool(cards.get(d.callId), d); scrollDown(); }
      else if (ev === 'error') { bodyEl.insertAdjacentHTML('beforeend', `<div class="err">${esc(d.message)}</div>`); }
      else if (ev === 'done') {
        am.status = d.status;
        if (d.status !== 'done' && d.status !== 'aborted')
          bodyEl.insertAdjacentHTML('beforeend', `<div class="warn">结束状态：${esc(d.status)}${d.rounds ? ` · 工具 ${d.rounds} 轮` : ''}</div>`);
      }
    });
  } catch (e) {
    if (e.name !== 'AbortError') bodyEl.insertAdjacentHTML('beforeend', `<div class="err">${esc(e.message)}</div>`);
    else bodyEl.insertAdjacentHTML('beforeend', '<div class="warn">已停止显示（服务端仍会把这条写完并存好）</div>');
  } finally {
    bodyEl.classList.remove('cursor');
    bodyEl.querySelector('.pend')?.remove();
    delete am.live;                     // 标记不能进 meta，更不能进 IndexedDB
    am.meta = { reasoning: reasonText, tools: [...cards.values()].map((c) => c._data), notices };
    S.streaming = false; setSend(false);
    if (text || imgs.length) S.convTitle = S.convTitle === '新对话' ? (text || '图片').slice(0, 30) : S.convTitle;
    $('#convTitle').textContent = S.convTitle;
    paintActs(actsEl, am);
    scrollDown();
    // 没等到 done 就是被「停止」或网络掐了，服务端那边还在往 D1 写完整答案，
    // 本地这个 streaming 状态不可信，缓存了下次刷新就会错报「这条没写完就中断了」
    cacheMsgs(S.convId, am.status === 'streaming' ? [um] : [um, am]);
    // 服务端会自己取标题，刷新完以它为准
    loadConvs().then(() => {
      const c = S.convs.find((x) => x.id === S.convId);
      if (c) { S.convTitle = c.title; $('#convTitle').textContent = c.title; }
    });
    if (S.tts && answer) speakMessage(am, actsEl.querySelector('[data-a=speak]'));
  }
}
function dropFrom(messageId) {
  const nodes = [...$('#msgs').children];
  const i = nodes.findIndex((n) => n._data?.id === messageId);
  if (i < 0) return;
  const since = nodes[i]._data.created_at || 0;
  const deadKeys = [];
  for (const n of nodes.slice(i)) {
    // 文件气泡没有 _data，但它跟着自己那条回答一起走，字节也一并删掉
    if (n.dataset.fkey) { deadKeys.push(n.dataset.fkey); n.remove(); continue; }
    const idx = S.msgs.findIndex((m) => m.id === n._data?.id);
    if (idx >= 0) S.msgs.splice(idx, 1);
    n.remove();
  }
  // 服务端从这条往后都删了，本地只跟着删这一段：更早的是本地独有的存档，别一并抹掉
  dropMsgCacheFrom(S.convId, since);
  if (deadKeys.length) dropFileKeys(deadKeys);
}
function liveTool(d) {
  const el = toolCard(d);
  el._data = { name: d.name, args: d.args, status: 'running' };
  paintTool(el, '调用中…');
  return el;
}
function doneTool(el, d) {
  if (!el) return;
  el._data = { ...el._data, status: 'done', sources: d.sources, preview: (d.preview || '').slice(0, 600) };
  paintTool(el, '完成', 'ok');
}
function badTool(el, d) {
  if (!el) return;
  el._data = { ...el._data, status: 'error', message: d.message };
  paintTool(el, '失败', 'bad');
  el.insertAdjacentHTML('beforeend', `<div class="warn">${esc(d.message || '')}</div>`);
}
function regen(m) {

  sendOnce(() => send({ regenerate: true, rollbackTo: m.id, content: '' }));
}
function sendOnce(fn) { if (S.streaming) return toast('正在回复中，先等一等'); fn(); }

function setSend(stop) {

}

// ——— 语音朗读（Edge 在线 TTS，非 Edge 内核退回系统音色）——————
const TTS = { playing: null, url: null, audio: null, busy: false, utter: null };
const VOICES = [
  ['zh-CN-XiaoxiaoNeural', '小晓 · 女声（默认）'],
  ['zh-CN-XiaoyiNeural', '晓伊 · 女声'],
  ['zh-CN-YunxiNeural', '云希 · 男声'],
  ['zh-CN-YunjianNeural', '云健 · 男声'],
  ['en-US-AriaNeural', 'Aria · 英文女声'],
];
const EDGE_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';

// 只有 User-Agent 里带 Edg/<主版本>、且 Sec-MS-GEC-Version 主版本一致时才放行；
// Worker 改不了出站 WS 的头，所以这步只能放在浏览器里做。
function edgeMajor() { const m = /Edg\/(\d+)\./.exec(navigator.userAgent); return m ? m[1] : null; }

function ttsPlain(md) {
  return (md || '')
    .replace(/```[\s\S]*?```/g, '（代码段略）')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^\s*[#>*-]+/gm, ' ')
    .replace(/\|/g, '，').replace(/[*_~#]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 3000);
}
function splitSegments(text, size = 520) {
  const out = [];
  let buf = '';
  for (const sent of text.split(/(?<=[。！？；.!?;])\s*/)) {
    if ((buf + sent).length > size && buf) { out.push(buf); buf = sent; }
    else buf += sent;
    while (buf.length > size * 2) { out.push(buf.slice(0, size * 2)); buf = buf.slice(size * 2); }
  }
  if (buf.trim()) out.push(buf.trim());
  return out.length ? out : [text];
}
async function secMsGec() {
  let ticks = BigInt(Math.floor(Date.now() / 1000)) + 11644473600n;
  ticks -= ticks % 300n;                       // 向下取整到 5 分钟
  const buf = await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode((ticks * 10000000n).toString() + EDGE_TOKEN));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}
function xmlEsc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;'); }
function edgeTs() { return new Date().toUTCString().replace('GMT', 'GMT+0000 (Coordinated Universal Time)'); }

async function edgeSegment(seg, voice, major, signal) {
  const gec = await secMsGec();
  const url = `wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1`
    + `?TrustedClientToken=${EDGE_TOKEN}&Sec-MS-GEC=${gec}&Sec-MS-GEC-Version=1-${major}.0.0.0`;
  const rid = crypto.randomUUID().replace(/-/g, '');
  return await new Promise((resolve, reject) => {
    const ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    const parts = [];
    let settled = false;
    const finish = (err) => {
      if (settled) return; settled = true;
      clearTimeout(timer); try { ws.close(); } catch {}
      if (err) reject(err); else resolve(new Blob(parts, { type: 'audio/mpeg' }));
    };
    const timer = setTimeout(() => finish(new Error('朗读请求超时')), 20000);
    signal?.addEventListener('abort', () => finish(new Error('已取消')));
    ws.onopen = () => {
      ws.send('X-Timestamp:' + edgeTs() + '\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n'
        + '{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"true","wordBoundaryEnabled":"false"},'
        + '"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}\r\n');
      const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='zh-CN'>`
        + `<voice name='${voice}'><prosody pitch='+0%' rate='+0%' volume='+0%'>${xmlEsc(seg)}</prosody></voice></speak>`;
      ws.send(`X-RequestId:${rid}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${edgeTs()}Z\r\nPath:ssml\r\n\r\n${ssml}`);
    };
    ws.onerror = () => finish(new Error('无法连接 Edge 语音服务'));
    // 没收到 turn.end 就断，一律当失败：半截 mp3 播出来只会让人以为是音质问题
    ws.onclose = (e) => finish(new Error('连接被拒绝' + (e.code ? `（${e.code}）` : '') + '，可能 Edge 版本过旧'));
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') { if (/Path:turn\.end/.test(ev.data)) finish(null); return; }
      const d = new Uint8Array(ev.data);
      const headerLen = (d[0] << 8) | d[1];
      parts.push(d.slice(headerLen + 2));
    };
  });
}
async function edgeSynth(text, voice, signal) {
  const major = edgeMajor();
  if (!major) throw new Error('当前浏览器不是 Edge 内核');
  const blobs = [];
  for (const seg of splitSegments(text)) blobs.push(await edgeSegment(seg, voice, major, signal));
  return new Blob(blobs, { type: 'audio/mpeg' });
}
function browserSpeak(text, signal) {
  if (!('speechSynthesis' in window)) throw new Error('没有可用的系统音色');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 1.02;
  const v = speechSynthesis.getVoices().find((x) => /^zh|chinese/i.test(x.lang));
  if (v) u.voice = v;
  TTS.utter = u;
  u.onend = () => { if (signal.aborted) return; clearSpeak(); };
  u.onerror = () => clearSpeak();
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
async function speakMessage(m, btn) {
  if (TTS.playing === m.id) { stopSpeak(); refreshSpeakBtns(); return; }
  stopSpeak();
  const text = ttsPlain(m.content);
  if (!text) return toast('这条没有可朗读的文字');
  TTS.playing = m.id; TTS.busy = true; refreshSpeakBtns();
  if (btn) btn.classList.add('on');
  const ctrl = new AbortController();
  TTS.ctrl = ctrl;
  try {
    try {
      const blob = await edgeSynth(text, S.voice, ctrl.signal);
      if (ctrl.signal.aborted) return;
      playBlob(blob);
    } catch (e) {
      if (ctrl.signal.aborted) return;
      toast('Edge 语音不可用，改用系统音色：' + e.message);
      browserSpeak(text, ctrl.signal);
    }
  } catch (e) { if (!ctrl.signal.aborted) toast('朗读失败：' + e.message); }
  finally { TTS.busy = false; if (TTS.playing === m.id && !TTS.url) refreshSpeakBtns(); }
}
function playBlob(blob) {
  TTS.url = URL.createObjectURL(blob);
  TTS.audio = new Audio(TTS.url);
  TTS.audio.onended = () => { stopSpeak(); };
  TTS.audio.play().catch(() => { stopSpeak(); toast('浏览器拦住了自动播放，再点一次朗读'); });
}
function clearSpeak() {
  TTS.playing = null; TTS.ctrl = null; refreshSpeakBtns();
}
function stopSpeak() {
  if (TTS.ctrl) TTS.ctrl.abort();
  if (TTS.audio) { TTS.audio.pause(); TTS.audio = null; }
  if (TTS.url) { URL.revokeObjectURL(TTS.url); TTS.url = null; }
  if (TTS.utter) { try { speechSynthesis.cancel(); } catch {} TTS.utter = null; }
  clearSpeak();
}
function refreshSpeakBtns() {
  document.querySelectorAll('.acts button[data-a=speak]').forEach((b) => {
    const on = TTS.playing === b.closest('.msg')._data?.id;
    b.classList.toggle('on', on);
    b.title = on ? '停止朗读' : '朗读这条';
    // 图标自己会换播放/停止那一份，文字只改 .lb，别把 SVG 一起清掉
    b.querySelector('.lb').textContent = on ? '停止' : '朗读';
  });
}

$('#newBtn').onclick = () => { newChat(); closeDrawers(); };
$('#logout').onclick = signOut;
$('#lightbox').onclick = () => $('#lightbox').classList.remove('on');
$('#exportBtn').onclick = (e) => { e.stopPropagation(); $('#exportPop').classList.toggle('on'); };
document.addEventListener('click', () => $('#exportPop').classList.remove('on'));
$('#exportPop').onclick = (e) => { if (e.target.dataset.x) exportConv(e.target.dataset.x); };
// 侧栏的 × 只在 hover 时露出来，手机上根本找不到，所以顶栏也给一个删除入口
$('#delConvBtn').onclick = async () => {
  if (!S.convId) return toast('现在还没打开会话，没有可删的');
  const title = S.convTitle || '对话';
  if (!confirm(`删除「${title}」及其全部消息？`)) return;
  const id = S.convId;
  try {
    await api(`conversations/${id}`, { method: 'DELETE' });
    await dropFilesOf(id);       // 导出的 Word/PDF 也留在这台机器上，删会话得一起清掉
    newChat();
    await loadConvs();
    toast('已删除该会话');
  } catch (e) { toast(e.message); }
};
function exportConv(kind) {
  if (!S.msgs.length) return toast('这个会话还没有内容');
  const title = S.convTitle || '对话';
  let text, name, type;
  if (kind === 'json') {
    text = JSON.stringify({ title, exported_at: new Date().toISOString(), messages: S.msgs.map((m) => ({
      role: m.role, content: m.content, images: m.images || [], meta: m.meta || null, created_at: m.created_at })) }, null, 2);
    name = 'json'; type = 'application/json';
  } else {
    text = `# ${title}\n\n` + S.msgs.map((m) => {
      const head = m.role === 'user' ? '## 我' : '## ' + appName();
      const imgs = (m.images || []).length ? `\n（附 ${m.images.length} 张图片）` : '';
      const tools = m.meta?.tools?.length ? `\n> 调用了 ${m.meta.tools.map((t) => toolLabel(t.name)).join('、')}\n` : '';
      return `${head}${imgs}\n\n${m.content || '（空）'}\n${tools}`;
    }).join('\n---\n\n');
    name = 'md'; type = 'text/markdown';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = `${title.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40)}.${name}`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
  pushSettings();
};
applyTheme(S.theme);

// ——— 登录 / 注册 ————————————————————————————
// 注册和登录填的是同一组字段，只多一个口令：口令错就什么都建不出来
let gateMode = 'login';
function setGateMode(mode) {
  gateMode = mode === 'register' ? 'register' : 'login';
  const reg = gateMode === 'register';
  $('#gateSubmit').textContent = reg ? '注册并登录' : '登录';
  $('#gatePw').autocomplete = reg ? 'new-password' : 'current-password';
  $('#gatePw').placeholder = reg ? '设置密码（6–64 位）' : '密码';
  $('#gateTip').innerHTML = reg
    ? '第一次用：手机号没注册过就能建号，访问口令要填对。<br>口令提示：<b>0010</b>'
    : '手机号 + 密码登录。<br>口令提示：<b>0010</b>';
  $('#gateSwitchTip').textContent = reg ? '已经有账号了？' : '还没有账号？';
  $('#gateSwitch').textContent = reg ? '去登录' : '注册一个';
  $('#gateErr').classList.add('hide');
}
$('#gateSwitch').onclick = () => setGateMode(gateMode === 'login' ? 'register' : 'login');
$('#gatePhone').value = S.phone;
setGateMode('login');

$('#gateForm').onsubmit = async (e) => {
  e.preventDefault();
  const err = $('#gateErr'); err.classList.add('hide');
  const btn = $('#gateSubmit'); btn.disabled = true;
  try {
    const body = {
      phone: $('#gatePhone').value.trim(),
      password: $('#gatePw').value,
      accessPassword: $('#gateAccess').value,
    };
    const res = await fetch(`/api/auth/${gateMode === 'register' ? 'register' : 'login'}`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `失败（${res.status}）`);
    S.token = data.token; S.phone = body.phone;
    localStorage.setItem('db.tok', data.token);
    localStorage.setItem('db.phone', body.phone);
    $('#gateAccess').value = '';
    $('#gate').classList.add('hide');
    await boot();
  } catch (e2) { err.textContent = e2.message; err.classList.remove('hide'); }
  finally { btn.disabled = false; }
};

function maskPhone(p) {
  return /^\d{11}$/.test(p) ? `${p.slice(0, 3)}****${p.slice(7)}` : (p || '未登录');
}

async function loadSettings() {
  try {
    applyServerSettings((await api('settings')).settings);
  } catch { /* 拿不到就用本机缓存的那份，不该因此挡住界面 */ }
  settingsLoaded = true;
}

async function boot() {
  try {
    $('#acctLine').textContent = '当前账号：' + maskPhone(S.phone);
    await adoptLegacyCache();
    paintToggles();
    // 首屏先吃本地缓存：侧栏和最近一个会话马上有内容，不等这一串往返
    const local = (await cachedConvs()).sort((a, b) => (b.updated_at ?? 0) - (a.updated_at ?? 0));
    if (local.length) { S.convs = local; paintConvs(local); openConv(local[0].id); }
    await loadSettings();
    await Promise.all([loadProviders(), loadMcp(), loadConvs()]);
    if (!S.providers.some((p) => p.is_enabled)) {
      $('#msgs').innerHTML = '<div class="empty"><h2>还没有启用中的供应商</h2><p>点右上角 ⚙ 添加一个，例如学校 v100 的 OpenAI 兼容地址。</p></div>';
      openDrawer();
    } else if (!local.length) {
      if (S.convs.length) await openConv(S.convs[0].id); else newChat();
    }
    if (S.tts && !edgeMajor()) toast('当前浏览器不是 Edge 内核，朗读将使用系统音色');
  } catch (e) { console.warn(e); toast(e.message); }
}

(async function init() {
  if (!S.token) return;
  const res = await fetch('/api/auth', { headers: { authorization: 'Bearer ' + S.token } });
  if (!res.ok) return signOut();
  const data = await res.json().catch(() => ({}));
  // 单用户版的令牌身份是 'owner'，多用户版不再认它。与其画出一个空历史的界面
  // 让人以为聊天丢了，不如直接请回登录页重登一次
  if (!data.userId || data.userId === 'owner') return signOut();
  S.phone = data.userId;
  $('#gate').classList.add('hide');
  boot();
})();
</script>
</body>
